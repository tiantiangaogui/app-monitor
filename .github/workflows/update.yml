name: 每日包体状态核验

on:
  schedule:
    # 每天 UTC 00:15 运行（北京时间 08:15），错开整点高峰
    - cron: '15 0 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发一次

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行状态检测脚本
        run: python check_status.py

      - name: 提交更新（若数据有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新包体状态 $(date -u +%F)"
            git push
            echo "已提交并推送最新状态数据"
          fi
