name: 包体状态核验

on:
  schedule:
    # 每小时尝试一次。GitHub cron 不保证准点（实测会延迟 1~8 小时甚至跳过），
    # 所以这里用「高频尝试 + 脚本内节流」换稳定性：真跑之前 check_status.py 会判断
    # 距上次实际更新是否满 4 小时，未满则直接退出，因此对外表现的更新间隔仍是约 4 小时。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 4 小时节流，强制执行一次核验'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行状态检测（含下架邮件通知）
        run: python check_status.py
        env:
          # 以下 SMTP 凭证从仓库 Settings -> Secrets and variables -> Actions 读取；
          # 未配置时脚本会自动跳过邮件发送，任务不会因此失败
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 手动触发且勾选 force 时跳过节流；定时触发恒为空，走节流判断
          FORCE_CHECK: ${{ github.event.inputs.force }}
          # 距上次实际更新不足该小时数则本轮跳过（默认 4 小时）
          MIN_INTERVAL_HOURS: '4'

      - name: 提交更新（若数据有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json meta.json
          if git diff --cached --quiet; then
            echo "data.json / meta.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新包体状态 $(date -u +%F-%H)"
            git push
            echo "已提交并推送最新状态数据"
          fi
