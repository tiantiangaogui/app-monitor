name: 包体状态核验（每小时）

on:
  schedule:
    # 每小时整点运行（GitHub cron 为 UTC 时间，即北京时间每小时整点），全天 24 次
    - cron: '0 * * * *'
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发一次

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行状态检测（含下架邮件通知）
        run: python check_status.py
        env:
          # 以下 SMTP 凭证从仓库 Settings -> Secrets and variables -> Actions 读取；
          # 未配置时脚本会自动跳过邮件发送，任务不会因此失败
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 提交更新（若数据有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新包体状态 $(date -u +%F-%H)"
            git push
            echo "已提交并推送最新状态数据"
          fi
